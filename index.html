<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>말랑말랑 한글 풍선</title>
<style>
  :root {
    --pastel1: #ff8fa3;
    --pastel2: #ffc785;
    --pastel3: #a0e7c4;
    --pastel4: #8ecdf7;
    --pastel5: #c7a4ff;
    --pastel6: #ffe066;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI Rounded", sans-serif;
  }

  body {
    background: linear-gradient(to bottom, #7fc8f8 0%, #bfe8ff 45%, #eaf9ff 100%);
    position: relative;
  }

  .screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  .screen.active {
    display: flex;
  }

  /* ---------- clouds ---------- */
  .cloud {
    position: absolute;
    background: #ffffff;
    border-radius: 50px;
    opacity: 0.85;
    z-index: 0;
    filter: blur(0.3px);
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
  }
  .cloud1 { width: 120px; height: 40px; top: 8%; left: 8%; animation: drift 26s linear infinite; }
  .cloud1::before { width: 60px; height: 60px; top: -30px; left: 15px; }
  .cloud1::after { width: 45px; height: 45px; top: -20px; left: 60px; }

  .cloud2 { width: 90px; height: 34px; top: 18%; left: 65%; animation: drift 34s linear infinite; }
  .cloud2::before { width: 50px; height: 50px; top: -24px; left: 10px; }
  .cloud2::after { width: 35px; height: 35px; top: -16px; left: 48px; }

  .cloud3 { width: 100px; height: 36px; top: 4%; left: 40%; animation: drift 20s linear infinite reverse; }
  .cloud3::before { width: 50px; height: 50px; top: -26px; left: 12px; }
  .cloud3::after { width: 40px; height: 40px; top: -18px; left: 52px; }

  @keyframes drift {
    0% { transform: translateX(0); }
    50% { transform: translateX(30px); }
    100% { transform: translateX(0); }
  }

  /* ---------- start screen ---------- */
  #start-screen {
    justify-content: flex-start;
    padding-top: 5vh;
    padding-bottom: 4vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .title {
    font-size: clamp(36px, 8vw, 64px);
    font-weight: 900;
    color: #ff6b81;
    text-shadow: 3px 3px 0 #ffffff, 5px 5px 8px rgba(0,0,0,0.15);
    margin: 0 0 4vh 0;
    text-align: center;
    z-index: 2;
    letter-spacing: 1px;
  }

  .menu {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 90%;
    max-width: 520px;
    z-index: 2;
  }

  .menu-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .mode-btn {
    width: 100%;
    min-height: 90px;
    border: none;
    border-radius: 28px;
    font-size: clamp(20px, 4.5vw, 28px);
    font-weight: 800;
    color: #ffffff;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15), 0 8px 14px rgba(0,0,0,0.15);
    transition: transform 0.08s ease;
  }
  .mode-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.15), 0 4px 8px rgba(0,0,0,0.15);
  }

  .mode-btn.m1 { background: linear-gradient(145deg, #ff9aa8, #ff6b81); }
  .mode-btn.m2 { background: linear-gradient(145deg, #8fd9c4, #4ecba0); }
  .mode-btn.m3 { background: linear-gradient(145deg, #8ecdf7, #5aa9e6); }
  .mode-btn.m4 { background: linear-gradient(145deg, #d4b3ff, #a978f0); }
  .mode-btn.m5 { background: linear-gradient(145deg, #ffcf8f, #ff9f43); }
  .mode-btn.m6 { background: linear-gradient(145deg, #ff9a8b, #ff6b6b); }

  .mode-desc {
    margin-top: 8px;
    font-size: clamp(14px, 3vw, 17px);
    color: #4a5568;
    font-weight: 600;
  }

  /* ---------- game screen ---------- */
  #game-screen {
    justify-content: flex-start;
  }

  .game-topbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    z-index: 3;
  }

  .home-btn {
    background: #ffffffcc;
    border: none;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
  }

  .progress-badge {
    background: #ffffffcc;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 20px;
    font-weight: 800;
    color: #4a5568;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
  }

  .star-badge {
    background: #ffffffcc;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 20px;
    font-weight: 800;
    color: #d68a00;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
    position: relative;
  }

  .prompt-area {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 16vh;
    z-index: 3;
  }

  .speak-btn {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(145deg, #ffd97a, #ffb84d);
    font-size: 52px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15), 0 8px 16px rgba(0,0,0,0.2);
    transition: transform 0.08s ease;
  }
  .speak-btn:active { transform: scale(0.94); }

  .prompt-letter {
    font-size: clamp(64px, 16vw, 110px);
    font-weight: 900;
    color: #ffffff;
    background: linear-gradient(145deg, #ff9aa8, #ff6b81);
    width: 150px;
    height: 150px;
    border-radius: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 0 rgba(0,0,0,0.12), 0 10px 18px rgba(0,0,0,0.18);
  }

  .prompt-emoji {
    font-size: clamp(70px, 18vw, 120px);
    line-height: 1;
    filter: drop-shadow(0 6px 6px rgba(0,0,0,0.2));
  }

  .balloon-area {
    position: relative;
    width: 100%;
    flex: 1;
    overflow: hidden;
    z-index: 2;
  }

  .balloon {
    position: absolute;
    bottom: -220px;
    width: 130px;
    height: 160px;
    border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    font-size: 30px;
    font-weight: 800;
    color: #ffffff;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.25);
    cursor: pointer;
    box-shadow: inset -10px -10px 25px rgba(0,0,0,0.12), inset 10px 10px 20px rgba(255,255,255,0.35), 0 10px 14px rgba(0,0,0,0.15);
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  .balloon::after {
    content: "";
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 14px solid currentColor;
  }

  @keyframes floatUp {
    0%   { transform: translate(0, 0) rotate(0deg); }
    18%  { transform: translate(-22px, -18vh) rotate(-5deg); }
    36%  { transform: translate(18px, -34vh) rotate(4deg); }
    54%  { transform: translate(-18px, -50vh) rotate(-4deg); }
    72%  { transform: translate(22px, -66vh) rotate(5deg); }
    90%  { transform: translate(-10px, -80vh) rotate(-2deg); }
    100% { transform: translate(0, -95vh) rotate(0deg); }
  }

  @keyframes shakeBalloon {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-14px) rotate(-6deg); }
    40% { transform: translateX(12px) rotate(6deg); }
    60% { transform: translateX(-10px) rotate(-4deg); }
    80% { transform: translateX(8px) rotate(4deg); }
  }

  .balloon.shake {
    animation: shakeBalloon 0.45s ease;
  }

  .balloon.popping {
    animation: none !important;
    transition: transform 0.5s ease, opacity 0.5s ease;
    transform: scale(1.5);
    opacity: 0;
    pointer-events: none;
  }

  .encourage-msg {
    position: fixed;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #ffffff;
    color: #ff6b81;
    font-size: 22px;
    font-weight: 800;
    padding: 14px 28px;
    border-radius: 30px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.2);
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 10;
    pointer-events: none;
  }
  .encourage-msg.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    z-index: 20;
    pointer-events: none;
    border-radius: 2px;
  }
  @keyframes confettiFly {
    0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }

  .star-pop {
    position: absolute;
    top: 0;
    right: 10px;
    font-size: 24px;
    font-weight: 900;
    color: #ffb400;
    opacity: 0;
    pointer-events: none;
  }
  @keyframes starPop {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-40px) scale(1.5); }
  }
  .star-pop.play { animation: starPop 0.8s ease forwards; }

  /* ---------- result screen ---------- */
  #result-screen {
    justify-content: center;
    gap: 24px;
    text-align: center;
    padding: 20px;
  }

  .result-title {
    font-size: clamp(32px, 7vw, 52px);
    font-weight: 900;
    color: #ff6b81;
    text-shadow: 2px 2px 0 #ffffff;
  }

  @keyframes resultBounce {
    0%   { transform: scale(0.4) rotate(-10deg); opacity: 0; }
    50%  { transform: scale(1.18) rotate(5deg); opacity: 1; }
    72%  { transform: scale(0.94) rotate(-3deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .result-title.animate {
    animation: resultBounce 0.7s ease;
  }

  .result-sub {
    font-size: clamp(16px, 4vw, 22px);
    color: #4a5568;
    font-weight: 700;
  }

  .star-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: 480px;
  }

  .star-row span {
    font-size: clamp(26px, 6vw, 40px);
  }

  .result-buttons {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 10px;
  }

  .result-btn {
    min-height: 80px;
    min-width: 200px;
    border: none;
    border-radius: 24px;
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 800;
    color: #ffffff;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15), 0 8px 14px rgba(0,0,0,0.15);
    padding: 10px 20px;
  }
  .result-btn:active { transform: translateY(3px); }
  .result-btn.retry { background: linear-gradient(145deg, #8fd9c4, #4ecba0); }
  .result-btn.home { background: linear-gradient(145deg, #8ecdf7, #5aa9e6); }

  /* ---------- 색칠 놀이 화면 ---------- */
  #color-screen {
    justify-content: flex-start;
  }

  .color-topbar {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    z-index: 3;
    flex-shrink: 0;
  }

  .color-title {
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 800;
    color: #4a5568;
  }

  .color-thumbs {
    width: 100%;
    display: flex;
    gap: 12px;
    padding: 6px 16px 12px 16px;
    overflow-x: auto;
    flex-shrink: 0;
    z-index: 3;
  }

  .color-thumb-btn {
    flex: 0 0 auto;
    width: 92px;
    height: 74px;
    border-radius: 16px;
    border: 3px solid transparent;
    background: #ffffff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.12);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
  }
  .color-thumb-btn svg { width: 100%; height: 100%; pointer-events: none; }
  .color-thumb-btn.active { border-color: #a978f0; background: #f3ebff; }

  .color-canvas-wrap {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 16px;
    z-index: 2;
  }

  #color-canvas {
    width: min(94vw, 560px);
    height: 100%;
    max-height: 44vh;
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }
  #color-canvas svg { width: 100%; height: 100%; }

  .fill-region {
    fill: #ffffff;
    stroke: #33404f;
    stroke-width: 4;
    stroke-linejoin: round;
    stroke-linecap: round;
    cursor: pointer;
    transition: fill 0.12s ease;
  }
  .fixed-dark { fill: #33404f; }
  .deco { fill: none; stroke: #33404f; stroke-width: 3; stroke-linecap: round; }

  .color-controls {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)) 16px;
    flex-shrink: 0;
    z-index: 3;
  }

  .swatch-row {
    flex: 1;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 4px 2px;
  }

  .swatch {
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 3px solid #ffffff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    cursor: pointer;
    padding: 0;
  }
  .swatch.active {
    border-color: #4a5568;
    transform: scale(1.15);
  }
  .swatch.eraser {
    background: #ffffff !important;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .reset-btn {
    flex: 0 0 auto;
    height: 50px;
    padding: 0 16px;
    border: none;
    border-radius: 18px;
    background: #ffffff;
    color: #4a5568;
    font-weight: 800;
    font-size: 15px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    cursor: pointer;
  }

  .celebrate-msg {
    position: fixed;
    top: 18%;
    left: 50%;
    transform: translateX(-50%) scale(0.6);
    background: #ffffff;
    color: #a978f0;
    font-size: 26px;
    font-weight: 900;
    padding: 16px 30px;
    border-radius: 30px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 30;
    pointer-events: none;
    text-align: center;
  }
  .celebrate-msg.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }

  /* ---------- 마트 놀이 화면 ---------- */
  #mart-screen {
    justify-content: flex-start;
  }

  .mart-topbar {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    z-index: 3;
    flex-shrink: 0;
  }

  .mart-title {
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 800;
    color: #4a5568;
    flex: 1;
  }

  .cart-badge {
    background: #ffffffcc;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 18px;
    font-weight: 800;
    color: #d68a00;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
  }

  .mart-tabs {
    width: 100%;
    display: flex;
    gap: 10px;
    padding: 4px 16px 10px 16px;
    overflow-x: auto;
    flex-shrink: 0;
    z-index: 3;
  }

  .mart-tab-btn {
    flex: 0 0 auto;
    border: none;
    border-radius: 20px;
    padding: 10px 18px;
    font-size: 16px;
    font-weight: 800;
    background: #ffffffcc;
    color: #4a5568;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.12);
  }
  .mart-tab-btn.active {
    background: linear-gradient(145deg, #ffcf8f, #ff9f43);
    color: #ffffff;
  }

  .mart-grid-wrap {
    flex: 1;
    min-height: 0;
    width: 100%;
    overflow-y: auto;
    padding: 6px 16px;
    z-index: 2;
  }

  .mart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 12px;
    padding-bottom: 8px;
  }

  .mart-item-btn {
    border: none;
    border-radius: 18px;
    background: #ffffff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.12);
    padding: 10px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    min-height: 84px;
  }
  .mart-item-btn .emoji { font-size: 34px; }
  .mart-item-btn .label { font-size: 14px; font-weight: 700; color: #4a5568; }

  .cart-row-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)) 16px;
    flex-shrink: 0;
    z-index: 3;
    background: rgba(255,255,255,0.55);
  }

  .cart-row {
    flex: 1;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px;
    min-height: 40px;
    align-items: center;
  }

  .cart-chip {
    flex: 0 0 auto;
    font-size: 26px;
    background: #ffffff;
    border-radius: 12px;
    padding: 4px 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  }

  .cart-empty-hint {
    font-size: 14px;
    color: #6b7a90;
    font-weight: 600;
  }

  .fly-item {
    position: fixed;
    font-size: 30px;
    z-index: 40;
    pointer-events: none;
    transition: transform 0.55s cubic-bezier(.3,.6,.4,1), opacity 0.55s ease;
  }

  /* ---------- 피자 요리사 화면 ---------- */
  #pizza-screen {
    justify-content: flex-start;
  }

  .pizza-topbar {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    z-index: 3;
    flex-shrink: 0;
  }

  .pizza-title {
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 800;
    color: #4a5568;
  }

  .pizza-stage-wrap {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 16px;
    z-index: 2;
  }

  .pizza-base {
    position: relative;
    width: min(78vw, 340px);
    height: min(78vw, 340px);
    border-radius: 50%;
    background: radial-gradient(circle closest-side at 50% 50%,
      #ffe9a8 0%, #ffe9a8 76%,
      #d1483a 76%, #d1483a 89%,
      #eab976 89%, #eab976 100%);
    box-shadow: 0 10px 24px rgba(0,0,0,0.25), inset 0 0 0 3px rgba(0,0,0,0.08);
    cursor: pointer;
    overflow: hidden;
  }

  .pizza-base::before,
  .pizza-base::after {
    content: "";
    position: absolute;
    width: 8%;
    height: 8%;
    border-radius: 50%;
    background: #ffd873;
    opacity: 0.7;
  }
  .pizza-base::before { top: 30%; left: 28%; }
  .pizza-base::after { top: 55%; left: 62%; }

  .topping-el {
    position: absolute;
    font-size: 30px;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
    cursor: pointer;
    line-height: 1;
  }

  .baking-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 50%;
    background: rgba(255, 140, 0, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .baking-overlay.active {
    opacity: 1;
    animation: bakeFlicker 0.6s ease-in-out infinite alternate;
  }
  @keyframes bakeFlicker {
    0% { opacity: 0.25; }
    100% { opacity: 0.5; }
  }

  .pizza-topping-row {
    width: 100%;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 4px 16px 10px 16px;
    flex-shrink: 0;
    z-index: 3;
  }

  .topping-btn {
    flex: 0 0 auto;
    width: 54px;
    height: 54px;
    border-radius: 16px;
    border: 3px solid #ffffff;
    background: #ffffff;
    font-size: 26px;
    display: flex;

<script>
(function () {

    { emoji: "🐘", word: "코끼리" },

    { emoji: "✈️", word: "비행기" },
    { emoji: "🚂", word: "기차" },
    { emoji: "⛵", word: "배" },
    { emoji: "🏫", word: "학교" },
    { emoji: "⚽", word: "축구공" },
    { emoji: "🎂", word: "케이크" },
    { emoji: "🍕", word: "피자" },
    { emoji: "🍦", word: "아이스크림" },
    { emoji: "📚", word: "책" },
    { emoji: "✏️", word: "연필" },
    { emoji: "👕", word: "옷" },
    { emoji: "👟", word: "신발" },
    { emoji: "🚪", word: "문" }
  ];

  var BALLOON_COLORS = ["#ff8fa3", "#ffb84d", "#4ecba0", "#5aa9e6", "#b18bff", "#ffd93d", "#ff7f6b", "#5ad1c9"];

  var TOTAL_QUESTIONS = 10;

  var state = {
    mode: null,
    currentIndex: 0,
    stars: 0,
    questions: [],
    answered: false
  };

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function pickN(pool, n) {
    return shuffle(pool).slice(0, n);
  }

  function buildLetterQuestion() {
    var target = LETTERS[Math.floor(Math.random() * LETTERS.length)];
    var others = LETTERS.filter(function (l) { return l !== target; });
    var distractors = pickN(others, 3);
    var options = shuffle([target].concat(distractors));
    return { correctAnswer: target, options: options };
  }

  function buildWordQuestion() {
    var targetPair = WORD_PAIRS[Math.floor(Math.random() * WORD_PAIRS.length)];
    var others = WORD_PAIRS.filter(function (p) { return p.word !== targetPair.word; });
    var distractors = pickN(others, 3).map(function (p) { return p.word; });
    var options = shuffle([targetPair.word].concat(distractors));
    return { correctAnswer: targetPair.word, options: options, emoji: targetPair.emoji };
  }

  function generateQuestions(mode) {
    var qs = [];
    for (var i = 0; i < TOTAL_QUESTIONS; i++) {
      if (mode === 1 || mode === 2) {
        qs.push(buildLetterQuestion());
      } else {
        qs.push(buildWordQuestion());
      }
    }
    return qs;
  }

  function showScreen(id) {
    var screens = document.querySelectorAll(".screen");
    screens.forEach(function (s) { s.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
  }

  // ---------- Audio ----------
  var audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    return audioCtx;
  }

  function playDing() {
    try {
      var ctx = getAudioCtx();
      if (ctx.state === "suspended") { ctx.resume(); }
      var now = ctx.currentTime;
      var notes = [880, 1320];
      notes.forEach(function (freq, idx) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        var start = now + idx * 0.12;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.3, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.4);
      });
    } catch (e) { /* audio not available, ignore */ }
  }

  // 가능한 한국어 음성 중 가장 또렷한 음성을 골라 캐시해둔다.
  var koreanVoice = null;
  function pickKoreanVoice() {
    if (!("speechSynthesis" in window)) { return null; }
    var voices = window.speechSynthesis.getVoices();
    var koreans = voices.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf("ko") === 0; });
    if (!koreans.length) { return null; }
    var preferred = ["google 한국의", "google korean", "yuna", "heami", "sun-hi", "injoon", "narae", "korean"];
    for (var p = 0; p < preferred.length; p++) {
      for (var i = 0; i < koreans.length; i++) {
        if (koreans[i].name.toLowerCase().indexOf(preferred[p]) !== -1) { return koreans[i]; }
      }
    }
    return koreans[0];
  }

  function refreshKoreanVoice() {
    var v = pickKoreanVoice();
    if (v) { koreanVoice = v; }
  }
  refreshKoreanVoice();
  if ("speechSynthesis" in window && "onvoiceschanged" in window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = refreshKoreanVoice;
  }

  function speakOnce(text) {
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = "ko-KR";
    if (koreanVoice) { utter.voice = koreanVoice; }
    utter.rate = 0.72;
    utter.pitch = 1.0;
    utter.volume = 1;
    window.speechSynthesis.speak(utter);
  }

  // 한 글자짜리 낱글자는 구분이 쉽도록 짧게 두 번 읽어준다.
  function speakText(text, options) {
    if (!("speechSynthesis" in window)) { return; }
    options = options || {};
    try {
      if (!koreanVoice) { refreshKoreanVoice(); }
      if (options.cancelFirst) { window.speechSynthesis.cancel(); }
      var isSingleLetter = Array.from(text).length === 1;
      speakOnce(text);
      if (isSingleLetter) { speakOnce(text); }
    } catch (e) { /* ignore */ }
  }

  // 발음이 끝날 때까지 다음 문제로 넘어가지 않도록 대략적인 재생 시간을 추정한다.
  function estimateSpeechMs(text) {
    var chars = Array.from(text).length;
    var isSingleLetter = chars === 1;
    var oneRead = 480 + chars * 340;
    var total = isSingleLetter ? oneRead * 2 : oneRead;
    return Math.min(3200, total);
  }

  // ---------- Game flow ----------
  window.startGame = function (mode) {
    state.mode = mode;
    state.currentIndex = 0;
    state.stars = 0;
    state.questions = generateQuestions(mode);
    updateStarBadge();
    showScreen("game-screen");
    renderQuestion();
  };

  window.retrySame = function () {
    startGame(state.mode);
  };

  window.goHome = function () {
    if ("speechSynthesis" in window) { window.speechSynthesis.cancel(); }
    showScreen("start-screen");
  };

  function updateStarBadge() {
    document.getElementById("star-badge").firstChild.textContent = "⭐ x " + state.stars;
  }

  function renderQuestion() {
    state.answered = false;
    var q = state.questions[state.currentIndex];
    document.getElementById("progress-badge").textContent = (state.currentIndex + 1) + " / " + TOTAL_QUESTIONS;

    var promptArea = document.getElementById("prompt-area");
    promptArea.innerHTML = "";

    if (state.mode === 1) {
      var speakBtn = document.createElement("button");
      speakBtn.className = "speak-btn";
      speakBtn.textContent = "🔊";
      speakBtn.setAttribute("aria-label", "소리 듣기");
      speakBtn.onclick = function () { speakText(q.correctAnswer, { cancelFirst: true }); };
      promptArea.appendChild(speakBtn);
      speakText(q.correctAnswer, { cancelFirst: true });
    } else if (state.mode === 2) {
      var letterBox = document.createElement("div");
      letterBox.className = "prompt-letter";
      letterBox.textContent = q.correctAnswer;
      promptArea.appendChild(letterBox);
    } else {
      var emojiBox = document.createElement("div");
      emojiBox.className = "prompt-emoji";
      emojiBox.textContent = q.emoji;
      promptArea.appendChild(emojiBox);
    }

    renderBalloons(q);
  }

  function renderBalloons(q) {
    var area = document.getElementById("balloon-area");
    area.innerHTML = "";
    var colors = shuffle(BALLOON_COLORS).slice(0, 4);
    var lefts = shuffle([6, 30, 54, 76]);

    q.options.forEach(function (opt, idx) {
      var balloon = document.createElement("div");
      balloon.className = "balloon";
      balloon.textContent = opt;
      balloon.style.color = colors[idx];
      balloon.style.background = "linear-gradient(145deg, " + lightenColor(colors[idx]) + ", " + colors[idx] + ")";
      balloon.style.left = lefts[idx] + "%";
      var duration = 6 + Math.random() * 4;
      balloon.style.animationDuration = duration + "s";
      balloon.style.animationDelay = "-" + (Math.random() * duration).toFixed(2) + "s";
      balloon.dataset.value = opt;
      balloon.addEventListener("click", function () { onBalloonClick(balloon, opt, q.correctAnswer); });
      balloon.addEventListener("touchstart", function (e) { e.preventDefault(); onBalloonClick(balloon, opt, q.correctAnswer); }, { passive: false });
      area.appendChild(balloon);
    });
  }

  function lightenColor(hex) {
    var num = parseInt(hex.replace("#", ""), 16);
    var r = Math.min(255, (num >> 16) + 60);
    var g = Math.min(255, ((num >> 8) & 0xff) + 60);
    var b = Math.min(255, (num & 0xff) + 60);
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  function onBalloonClick(balloon, value, correctAnswer) {
    if (state.answered) { return; }

    if (value === correctAnswer) {
      state.answered = true;
      popBalloon(balloon);
      playDing();
      gainStar();
      disableAllBalloons();
      setTimeout(function () { speakText(correctAnswer, { cancelFirst: false }); }, 350);
      var nextDelay = ("speechSynthesis" in window) ? (350 + estimateSpeechMs(correctAnswer) + 350) : 900;
      setTimeout(nextQuestion, nextDelay);
    } else {
      shakeBalloon(balloon);
      showEncourage();
    }
  }

  function disableAllBalloons() {
    var balloons = document.querySelectorAll(".balloon");
    balloons.forEach(function (b) { b.style.pointerEvents = "none"; });
  }

  function popBalloon(balloon) {
    var rect = balloon.getBoundingClientRect();
    balloon.style.position = "fixed";
    balloon.style.left = rect.left + "px";
    balloon.style.top = rect.top + "px";
    balloon.style.bottom = "auto";
    balloon.style.animation = "none";
    // force reflow so the transition below applies cleanly
    void balloon.offsetWidth;
    balloon.classList.add("popping");
    spawnConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2);
  }

  function spawnConfetti(x, y) {
    var colors = ["#ff8fa3", "#ffd93d", "#4ecba0", "#5aa9e6", "#b18bff", "#ff7f6b"];
    for (var i = 0; i < 14; i++) {
      var piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = x + "px";
      piece.style.top = y + "px";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      var angle = Math.random() * Math.PI * 2;
      var dist = 60 + Math.random() * 90;
      var dx = Math.cos(angle) * dist;
      var dy = Math.sin(angle) * dist - 40;
      piece.style.setProperty("--dx", dx + "px");
      piece.style.setProperty("--dy", dy + "px");
      piece.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      piece.style.animation = "confettiFly " + (0.6 + Math.random() * 0.4) + "s ease-out forwards";
      document.body.appendChild(piece);
      (function (p) { setTimeout(function () { p.remove(); }, 1100); })(piece);
    }
  }

  function shakeBalloon(balloon) {
    balloon.classList.add("shake");
    setTimeout(function () { balloon.classList.remove("shake"); }, 450);
  }

  var encourageTimer = null;
  function showEncourage() {
    var msg = document.getElementById("encourage-msg");
    msg.classList.add("show");
    if (encourageTimer) { clearTimeout(encourageTimer); }
    encourageTimer = setTimeout(function () { msg.classList.remove("show"); }, 1500);
  }

  function gainStar() {
    state.stars++;
    updateStarBadge();
    var pop = document.getElementById("star-pop");
    pop.classList.remove("play");
    void pop.offsetWidth;
    pop.classList.add("play");
  }

  function nextQuestion() {
    state.currentIndex++;
    if (state.currentIndex >= TOTAL_QUESTIONS) {
      showResult();
    } else {
      renderQuestion();
    }
  }

  function showResult() {
    if ("speechSynthesis" in window) { window.speechSynthesis.cancel(); }
    var sub = document.getElementById("result-sub");
    var msgs = [
      "오늘도 한 걸음 성장했어요!",
      "정말 멋지게 해냈어요!",
      "최고예요! 다음에도 또 해봐요!",
      "훌륭해요! 한글이랑 점점 친해지고 있어요!"
    ];
    sub.textContent = msgs[Math.floor(Math.random() * msgs.length)];

    var starRow = document.getElementById("star-row");
    starRow.innerHTML = "";
    for (var i = 0; i < TOTAL_QUESTIONS; i++) {
      var span = document.createElement("span");
      span.textContent = i < state.stars ? "⭐" : "☆";
      starRow.appendChild(span);
    }

    showScreen("result-screen");

    var titleEl = document.querySelector("#result-screen .result-title");
    titleEl.classList.remove("animate");
    void titleEl.offsetWidth;
    titleEl.classList.add("animate");

    celebrateWin();
  }

  function selectPicture(pictureId) {
    colorState.currentPictureId = pictureId;
    var pic = COLOR_PICTURES.filter(function (p) { return p.id === pictureId; })[0];
    var canvas = document.getElementById("color-canvas");
    canvas.innerHTML = pic.svg;

    var thumbs = document.querySelectorAll(".color-thumb-btn");
    thumbs.forEach(function (t) { t.classList.remove("active"); });
    var activeThumb = document.getElementById("thumb-" + pictureId);
    if (activeThumb) { activeThumb.classList.add("active"); }

    if (!colorState.coloredData[pictureId]) { colorState.coloredData[pictureId] = {}; }
    var saved = colorState.coloredData[pictureId];

    var regions = canvas.querySelectorAll(".fill-region");
    regions.forEach(function (region) {
      var key = region.getAttribute("data-region");
      if (saved[key]) {
        region.style.fill = saved[key];
      }
      region.addEventListener("click", function () { onRegionClick(region, key); });
      region.addEventListener("touchstart", function (e) { e.preventDefault(); onRegionClick(region, key); }, { passive: false });
    });
  }

  function onRegionClick(region, key) {
    var pictureId = colorState.currentPictureId;
    var saved = colorState.coloredData[pictureId];
    if (colorState.currentColor === "eraser") {
      region.style.fill = "";
      delete saved[key];
    } else {
      region.style.fill = colorState.currentColor;
      saved[key] = colorState.currentColor;
    }
    checkColorCompletion(pictureId);
  }

  function checkColorCompletion(pictureId) {
    var canvas = document.getElementById("color-canvas");
    var regions = canvas.querySelectorAll(".fill-region");
    var saved = colorState.coloredData[pictureId];
    var allColored = regions.length > 0;
    regions.forEach(function (region) {
      var key = region.getAttribute("data-region");
      if (!saved[key]) { allColored = false; }
    });

    if (allColored && !colorState.completed[pictureId]) {
      colorState.completed[pictureId] = true;
      showColorCelebration();
    } else if (!allColored) {
      colorState.completed[pictureId] = false;
    }
  }

  function inlineComputedStyles(svgEl, clone) {
    var origEls = svgEl.querySelectorAll("*");
    var cloneEls = clone.querySelectorAll("*");
    for (var i = 0; i < origEls.length; i++) {
      var cs = window.getComputedStyle(origEls[i]);
      cloneEls[i].setAttribute("fill", cs.fill);
      cloneEls[i].setAttribute("stroke", cs.stroke);
      cloneEls[i].setAttribute("stroke-width", cs.strokeWidth);
      cloneEls[i].setAttribute("stroke-linejoin", cs.strokeLinejoin);
      cloneEls[i].setAttribute("stroke-linecap", cs.strokeLinecap);
      cloneEls[i].removeAttribute("class");
    }
  }

  function svgElementToPngDataUrl(svgEl, callback) {
    try {
      var clone = svgEl.cloneNode(true);
      inlineComputedStyles(svgEl, clone);
      if (!clone.getAttribute("xmlns")) { clone.setAttribute("xmlns", "http://www.w3.org/2000/svg"); }
      var vb = svgEl.viewBox && svgEl.viewBox.baseVal;
      var w = (vb && vb.width) ? vb.width : 300;
      var h = (vb && vb.height) ? vb.height : 300;
      var svgStr = new XMLSerializer().serializeToString(clone);
      var svgBlob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
      var url = URL.createObjectURL(svgBlob);
      var img = new Image();
      img.onload = function () {
        var canvas = document.createElement("canvas");
        var scale = 2;
        canvas.width = w * scale;
        canvas.height = h * scale;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        callback(canvas.toDataURL("image/png"));
      };
      img.onerror = function () { URL.revokeObjectURL(url); callback(null); };
      img.src = url;
    } catch (e) {
      callback(null);
    }
  }

  function flyToCart(emoji, sourceEl) {

    var fly = document.createElement("div");

    fly.style.top = (srcRect.top + srcRect.height / 2) + "px";
    document.body.appendChild(fly);
    void fly.offsetWidth;
    requestAnimationFrame(function () {
      fly.style.transform = "translate(" + (dstRect.left + dstRect.width / 2 - (srcRect.left + srcRect.width / 2)) + "px, " + (dstRect.top + dstRect.height / 2 - (srcRect.top + srcRect.height / 2)) + "px) scale(0.3)";

  function wirePizzaBaseClick() {
    var base = document.getElementById("pizza-base");
    base.addEventListener("click", function (e) {
      placeToppingAtEvent(e);
    });
    base.addEventListener("touchend", function (e) {
      if (e.changedTouches && e.changedTouches.length) {
        e.preventDefault();
        placeToppingAtEvent(e.changedTouches[0]);
      }
    }, { passive: false });
  }

  function placeToppingAtEvent(e) {
    var base = document.getElementById("pizza-base");
    var rect = base.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var y = e.clientY - rect.top;
    var cx = rect.width / 2;
    var cy = rect.height / 2;
    var dx = x - cx;
    var dy = y - cy;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var maxR = rect.width / 2 - 14;
    if (dist > maxR) {
      var scale = maxR / dist;
      x = cx + dx * scale;
      y = cy + dy * scale;
    }
    var xPct = (x / rect.width) * 100;
    var yPct = (y / rect.height) * 100;
    addTopping(pizzaState.selectedTopping, xPct, yPct);
  }

  function addTopping(topping, xPct, yPct) {
    var base = document.getElementById("pizza-base");

    base.appendChild(el);
    pizzaState.toppings.push({ el: el, topping: topping, x: xPct, y: yPct });

  }
